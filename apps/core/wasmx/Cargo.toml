[package]
name = "provable-wasmx-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared Provable WasmX ABI and cryptographic helpers"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[features]
default = []
module = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
